<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Phantom LARP Kit — Simulación</title>
<style>
:root{--bg:#000;--card:#1b1b1d;--card2:#222225;--text:#f7f7f8;--muted:#9b9ba1;--purple:#ab9dfd;--green:#55d984;--red:#ff4d57;--line:#29292d}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}body{min-height:100vh}.app{width:min(100%,900px);margin:auto;padding:calc(8px + env(safe-area-inset-top)) 18px calc(120px + env(safe-area-inset-bottom));min-height:100vh}.top{position:sticky;top:0;z-index:10;background:rgba(0,0,0,.9);backdrop-filter:blur(18px);padding:8px 0 16px}.nav{display:flex;gap:10px;align-items:center;overflow-x:auto;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.logo{flex:0 0 50px;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#6fd0aa,#fff0a3)}.ghost{width:33px;height:33px;border-radius:16px 16px 12px 12px;background:#17171a;position:relative;transform:rotate(-10deg)}.ghost:before,.ghost:after{content:"";position:absolute;width:5px;height:5px;border-radius:50%;background:var(--purple);top:10px}.ghost:before{left:9px}.ghost:after{right:9px}.ghost i{position:absolute;width:15px;height:4px;border-radius:4px;background:#f5e89e;bottom:7px;left:9px;transform:rotate(12deg)}.pill{border:0;background:#202022;color:#aaa;border-radius:23px;padding:13px 21px;font-weight:700;font-size:17px;white-space:nowrap}.pill.active{background:var(--purple);color:#111}.sim{margin-left:auto;border:1px solid #5d52a2;background:#161320;color:#d9d2ff;border-radius:999px;padding:8px 10px;font-size:10px;font-weight:900;letter-spacing:.08em}.account{padding:34px 2px 18px}.account-row{display:flex;justify-content:space-between;align-items:center}.account-name{color:#aaa;font-weight:700;font-size:18px}.edit{border:0;background:#1d1d20;color:#ddd;border-radius:13px;padding:9px 12px;font-weight:800}.balance{font-size:clamp(50px,13vw,78px);font-weight:850;letter-spacing:-4px;line-height:1;margin:17px 0 12px}.sub{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.change{font-weight:800;font-size:18px}.pos{color:var(--green)}.neg{color:var(--red)}.solEq{color:#aaa;background:#141416;border:1px solid #222;border-radius:10px;padding:6px 9px;font-size:13px}.section{margin-top:24px}.section-title{font-size:28px;font-weight:850;letter-spacing:-.8px;margin-bottom:12px}.section-head{display:flex;align-items:center;justify-content:space-between}.cash,.token,.perp,.pred{border:1px solid var(--line);background:linear-gradient(180deg,#1f1f21,#19191b);border-radius:26px}.cash{height:86px;display:flex;align-items:center;padding:0 22px}.cashIcon{width:44px;height:44px;border-radius:14px;background:#aaa;color:#242428;display:grid;place-items:center;font-size:24px;font-weight:900}.cash label{font-size:20px;font-weight:800;margin-left:18px}.cash b{margin-left:auto;font-size:20px;font-weight:500}.tokens{display:flex;flex-direction:column;gap:10px}.token{display:grid;grid-template-columns:52px 1fr auto;gap:13px;align-items:center;padding:14px 16px;min-height:94px}.coin{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-weight:900}.sol{background:linear-gradient(145deg,#9e68ff,#32dfc3);color:#101012}.usdc{background:#3975e7}.bonk{background:#f3a13f;color:#5c2b00}.wif{background:#d9c9b8;color:#2b211b}.token strong{display:block;font-size:20px}.token .meta{display:block;color:#9a9aa0;font-size:15px;margin-top:5px}.side{text-align:right}.side strong{font-size:18px;font-weight:600}.side span{display:block;margin-top:5px;font-size:14px}.perps{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,1fr);gap:10px;overflow-x:auto;scrollbar-width:none}.perp{padding:18px 16px;min-height:150px}.perpIcon{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:900;margin-bottom:18px}.btc{background:#f29d38}.eth{background:#e7e7e9;color:#25252a}.solp{background:linear-gradient(145deg,#956aff,#2cdac0);color:#111}.lev{background:#2a2a2d;border-radius:7px;padding:4px 7px;font-size:13px;margin-left:5px}.move{margin-top:12px;font-weight:800}.preds{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pred{padding:16px;min-height:120px}.pred small{color:#8e8e93;font-weight:800}.pred strong{display:block;font-size:22px;margin-top:13px}.pred p{color:#aaa;font-size:13px;margin:8px 0 0}.footnote{text-align:center;color:#8e8e94;font-size:12px;margin:24px 0}.bottom{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:0;width:min(900px,100%);padding:10px 18px calc(13px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,rgba(0,0,0,.9) 25%,#000 48%)}.warning{text-align:center;font-size:11px;font-weight:900;color:#cbc5f1;margin-bottom:8px}.bottomrow{display:flex;gap:11px}.search{height:58px;flex:1;border:1px solid #303034;border-radius:29px;background:rgba(35,35,38,.95);display:flex;align-items:center;color:#8d8d92;padding:0 18px;font-size:18px}.plus{width:58px;height:58px;border-radius:50%;border:0;background:var(--purple);font-size:39px}.sheet{display:none;position:fixed;z-index:100;inset:0;background:rgba(0,0,0,.66);align-items:flex-end;justify-content:center}.sheet.open{display:flex}.panel{width:min(900px,100%);background:#151517;border:1px solid #303034;border-radius:28px 28px 0 0;padding:14px 18px calc(24px + env(safe-area-inset-bottom))}.handle{width:42px;height:5px;background:#4b4b50;border-radius:5px;margin:0 auto 15px}.field{display:grid;grid-template-columns:1fr 135px;gap:12px;align-items:center;background:#202023;border:1px solid #2d2d31;border-radius:17px;padding:12px 14px;margin:9px 0}.field input{width:100%;border:0;outline:0;background:#101012;color:#fff;border-radius:11px;padding:10px;text-align:right;font-size:16px}.actions{display:flex;gap:10px;margin-top:14px}.actions button{flex:1;border:0;border-radius:16px;padding:14px;font-weight:850;font-size:15px}.cancel{background:#29292d;color:#eee}.save{background:var(--purple);color:#111}.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(15px);bottom:120px;background:#242427;border:1px solid #3b3b40;border-radius:14px;padding:11px 15px;font-weight:800;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(min-width:700px){.preds{grid-template-columns:repeat(4,1fr)}.perps{grid-auto-columns:220px}}@media(max-width:390px){.sim{display:none}.pill{padding:11px 17px;font-size:16px}.token{grid-template-columns:46px 1fr auto;padding:12px}.coin{width:46px;height:46px}.balance{font-size:54px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><nav class="nav"><div class="logo"><div class="ghost"><i></i></div></div><button class="pill active">Inicio</button><button class="pill">Operar</button><button class="pill">Predecir</button><button class="pill">Explorar</button><span class="sim">SIMULADOR</span></nav></header>
<main>
<section class="account"><div class="account-row"><div class="account-name">Cuenta 1⌄</div><button class="edit" id="edit1">Editar saldos</button></div><div class="balance" id="portfolio">$8.26</div><div class="sub"><span class="change" id="portfolioChange">$0.00 · 0.00%</span><span class="solEq" id="solEq">0.000000 SOL</span></div></section>
<section class="section"><div class="cash"><div class="cashIcon">•</div><label>Cash</label><b>$0.00</b></div></section>
<section class="section"><div class="section-head"><div class="section-title">Tokens ›</div><button class="edit" id="edit2">Editar</button></div><div class="tokens" id="tokens"></div></section>
<section class="section"><div class="section-title">Perps ›</div><div class="perps" id="perps"></div></section>
<section class="section"><div class="section-title">Predicciones ›</div><div class="preds" id="preds"></div></section>
<div class="footnote">Datos de mercado: CoinGecko · actualización automática cada 30 s</div>
</main>
</div>
<div class="bottom"><div class="warning">Simulación - No usar para engañar</div><div class="bottomrow"><div class="search">⌕&nbsp;&nbsp;Buscar en la simulación</div><button class="plus" id="plus">+</button></div></div>
<div class="sheet" id="sheet"><div class="panel"><div class="handle"></div><h2>Editar saldos simulados</h2><div id="fields"></div><div class="actions"><button class="cancel" id="cancel">Cancelar</button><button class="save" id="save">Guardar</button></div></div></div>
<div class="toast" id="toast">Actualizado</div>
<script>
const assets=[{id:'solana',symbol:'SOL',name:'Solana',cls:'sol',def:0},{id:'usd-coin',symbol:'USDC',name:'USD Coin',cls:'usdc',def:8.26449},{id:'bonk',symbol:'BONK',name:'Bonk',cls:'bonk',def:0},{id:'dogwifcoin',symbol:'WIF',name:'dogwifhat',cls:'wif',def:0}];
const ids=[...assets.map(x=>x.id),'bitcoin','ethereum'];let prices={},bal={};try{bal=JSON.parse(localStorage.getItem('larpBalances')||'{}')}catch(e){}assets.forEach(a=>bal[a.id]=Number.isFinite(Number(bal[a.id]))?Number(bal[a.id]):a.def);
const $=s=>document.querySelector(s);const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:n<1?4:2}).format(Number(n)||0);const qty=n=>{n=Number(n)||0;return Math.abs(n)>=1?n.toLocaleString('en-US',{maximumFractionDigits:6}):n.toLocaleString('en-US',{maximumFractionDigits:8})};const pct=n=>`${Number(n)>=0?'+':''}${(Number(n)||0).toFixed(2)}%`;
function render(){let total=0,weighted=0,weight=0;$('#tokens').innerHTML='';assets.forEach(a=>{const p=prices[a.id]||{usd:a.id==='usd-coin'?1:0,usd_24h_change:0};const value=(bal[a.id]||0)*(p.usd||0);total+=value;weighted+=(p.usd_24h_change||0)*value;weight+=value;$('#tokens').insertAdjacentHTML('beforeend',`<div class="token"><div class="coin ${a.cls}">${a.symbol==='USDC'?'$':a.symbol[0]}</div><div><strong>${a.symbol}</strong><span class="meta">${qty(bal[a.id])} ${a.symbol} · ${money(p.usd||0)}</span></div><div class="side"><strong>${money(value)}</strong><span class="${(p.usd_24h_change||0)>=0?'pos':'neg'}">${pct(p.usd_24h_change||0)}</span></div></div>`)});$('#portfolio').textContent=money(total);const ch=weight?weighted/weight:0;$('#portfolioChange').textContent=`${pct(ch)} · 24h`;$('#portfolioChange').className=`change ${ch>=0?'pos':'neg'}`;$('#solEq').textContent=`${prices.solana?.usd?qty(total/prices.solana.usd):'0.000000'} SOL`;renderPerps();renderPreds()}
function renderPerps(){const p=[['BTC','bitcoin','40x','btc'],['ETH','ethereum','25x','eth'],['SOL','solana','20x','solp']];$('#perps').innerHTML=p.map(([s,id,l,c])=>{const x=prices[id]||{};return `<div class="perp"><div class="perpIcon ${c}">${s==='BTC'?'₿':s==='ETH'?'◆':'S'}</div><b>${s} <span class="lev">${l}</span></b><div class="move ${(x.usd_24h_change||0)>=0?'pos':'neg'}">${pct(x.usd_24h_change||0)}</div><div class="meta">${money(x.usd||0)}</div></div>`}).join('')}
function renderPreds(){const rows=[['SOL 24h','solana'],['BTC 24h','bitcoin'],['ETH 24h','ethereum'],['BONK 24h','bonk']];$('#preds').innerHTML=rows.map(([n,id])=>{const c=prices[id]?.usd_24h_change||0;return `<div class="pred"><small>${n}</small><strong class="${c>=0?'pos':'neg'}">${c>=0?'ALCISTA':'BAJISTA'}</strong><p>Movimiento real 24 h: ${pct(c)}</p></div>`}).join('')}
async function fetchPrices(){try{const r=await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${ids.join(',')}&vs_currencies=usd&include_24hr_change=true`,{cache:'no-store'});if(!r.ok)throw new Error();prices=await r.json();render();toast('Precios actualizados')}catch(e){render();toast('CoinGecko no disponible')}}
function openSheet(){const f=$('#fields');f.innerHTML=assets.map(a=>`<div class="field"><label>${a.name} (${a.symbol})</label><input data-id="${a.id}" type="number" min="0" step="any" value="${bal[a.id]}"></div>`).join('');$('#sheet').classList.add('open')}function closeSheet(){$('#sheet').classList.remove('open')}function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>$('#toast').classList.remove('show'),1400)}
$('#edit1').onclick=$('#edit2').onclick=$('#plus').onclick=openSheet;$('#cancel').onclick=closeSheet;$('#sheet').onclick=e=>{if(e.target===$('#sheet'))closeSheet()};$('#save').onclick=()=>{document.querySelectorAll('#fields input').forEach(i=>bal[i.dataset.id]=Math.max(0,Number(i.value)||0));localStorage.setItem('larpBalances',JSON.stringify(bal));closeSheet();render();toast('Saldos guardados')};render();fetchPrices();setInterval(fetchPrices,30000);
</script>
</body>
</html>
